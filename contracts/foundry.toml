[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = false

# Gas reporting
gas_reports = ["*"]

# Test configuration
verbosity = 3

# Formatter
[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

# RPC endpoints
[rpc_endpoints]
blockdag = "https://rpc.primordial.bdagscan.com"

# Etherscan (for verification - adjust if BlockDAG has explorer API)
[etherscan]
blockdag = { key = "${BLOCKDAG_API_KEY}", url = "https://primordial.bdagscan.com/api" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
